# Fault-generator parameter ranges. Each synthetic case samples uniformly from these with
# numpy.random.default_rng(seed), so every case is reproducible from (generator, seed).
# Windows are drawn from clean spans of the store (see clean_spans) with a 72 h window
# ending at as_of; the fault occupies the last `hours` of the window.
#
# REVIEW: these ranges decide whether the score means anything. They are Claude's first
# pass (2026-09-28); the spec asks the human to approve them at the Phase 5 gate.

clean_spans:
  ERCO:
    - [2023-02-08, 2023-07-01]   # every ERCO series (incl. fuel, sub-BA, wind) exists here in the fixture
  CISO:
    - [2023-07-16, 2023-08-14]
  PJM:
    - [2023-07-16, 2023-08-14]

generators:
  H0_DATA_ARTIFACT:
    kind: [drop_hours, outliers]     # one of
    hours: [3, 12]                   # hours affected
    outlier_factor: [2.0, 4.0]       # multiply D by this
  H1_WEATHER_DEMAND:
    delta_temp_c: [-8.0, 8.0]        # shift of load-centre temperature; sign picks heating/cooling
    mw_per_degc: [600.0, 1500.0]     # demand sensitivity applied to the shift
    hours: [12, 48]
  H2_SUPPLY_SHORTFALL:
    fuel: [natural_gas, coal, nuclear, wind]
    loss_share: [0.3, 0.8]           # share of that fuel's output lost
    hours: [4, 24]
  H3_IMPORT_CONSTRAINT:
    hours: [6, 36]                   # interchange pinned at its 90-day max import
    extra_import_mw: [300.0, 1200.0] # how far past the recent extreme the pin sits
  H4_LOAD_SHED:
    shed_share: [0.12, 0.30]         # share of forecast demand shed
    hours: [3, 12]
  H5_SUBREGION_CONCENTRATION:
    scale: [1.3, 1.6]                # multiply one subregion's demand; below ~1.3 the shift is
    hours: [6, 36]                   # comparable to weather moving zones unevenly (see DECISIONS)
  H6_RENEWABLE_FORECAST_MISS:
    loss_share: [0.5, 0.95]          # share of wind output lost, made up by gas
    hours: [6, 24]
  H7_CALENDAR:
    forecast_inflation: [1.05, 1.15] # forecast shaped like an ordinary day on a holiday
