# Replay case: CAISO rolling blackouts, 2020-08-14 and 15. A West-wide heat wave raised
# demand while net-peak supply fell short (solar roll-off after sunset, imports unavailable
# because neighbours were also short); ~1 GW of firm load was shed on two evenings.
# as_of is the morning after the second evening; sub-BA and price coverage for 2020 is thin.
id: caiso_2020
name: CAISO rolling blackouts, August 2020
entity: CISO
metric: forecast_error_mw
as_of: 2020-08-16T12:00:00
recheck_as_of: 2020-08-19T12:00:00
ground_truth:
  ranked: [H4_LOAD_SHED, H2_SUPPLY_SHORTFALL, H3_IMPORT_CONSTRAINT, H1_WEATHER_DEMAND]
  cause: >-
    Heat-wave demand plus insufficient net-peak supply (solar roll-off, imports unavailable
    West-wide) forced ~1 GW of load shed on two evenings.
