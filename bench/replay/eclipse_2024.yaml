# Replay case: total solar eclipse of 2024-04-08 across Texas. A hard negative: ISOs
# forecast the solar loss well, so the demand miss is small; a confident root-cause call
# would be a false alarm. as_of is 20:00Z, ~1.5 h after totality left Texas.
id: eclipse_2024
name: Solar eclipse 2024-04-08
entity: ERCO
metric: forecast_error_mw
as_of: 2024-04-09T20:00:00
recheck_as_of: 2024-04-11T12:00:00
ground_truth:
  ranked: [H6_RENEWABLE_FORECAST_MISS, H7_CALENDAR]
  cause: >-
    Solar output fell ~90% along the path of totality; the day-ahead forecast largely
    anticipated it, so the miss is small and a confident root-cause call would be a false
    alarm.
expect_flagged: false
sources:
  - https://www.ercot.com/news/release/2024-04-08-eclipse
  - https://www.eia.gov/todayinenergy/detail.php?id=61664
