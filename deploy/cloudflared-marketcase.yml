# Cloudflare Tunnel routing for MarketCase (installed as ~/.cloudflared/marketcase.yml).
# The tunnel is found by name; its credentials file sits next to cert.pem in ~/.cloudflared.
tunnel: marketcase
ingress:
  # MCP can start paid investigations: never public (the app refuses it too)
  - hostname: marketcase.kanumadhok.com
    path: ^/(marketcase/)?mcp
    service: http_status:404
  - hostname: marketcase.kanumadhok.com
    service: http://100.115.94.44:8710
  - service: http_status:404
