# Cloudflare Tunnel routing for MarketCase (installed as ~/.cloudflared/marketcase.yml).
# The tunnel (marketcase-kayak) is named by id, so the host needs only its credentials file,
# ~/.cloudflared/<id>.json, and never the account-wide cert.pem.
tunnel: 06934798-4dab-49a5-9fa4-82dfd889bb69
ingress:
  # MCP can start paid investigations: never public (the app refuses it too)
  - hostname: marketcase.kanumadhok.com
    path: ^/(marketcase/)?mcp
    service: http_status:404
  - hostname: marketcase.kanumadhok.com
    service: http://100.125.186.6:8710
  - service: http_status:404
