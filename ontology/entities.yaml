  - {id: wz/dallas, name: Dallas, ba: ERCO, tz: America/Chicago, lat: 32.78, lon: -96.80}
  - {id: wz/austin, name: Austin, ba: ERCO, tz: America/Chicago, lat: 30.27, lon: -97.74}
  - {id: wz/san_antonio, name: San Antonio, ba: ERCO, tz: America/Chicago, lat: 29.42, lon: -98.49}
  - {id: wz/los_angeles, name: Los Angeles, ba: CISO, tz: America/Los_Angeles, lat: 34.05, lon: -118.24}
