# Entities for the v1 scope. Relations and fuel-category versioning are Phase 2
# (relations.yaml); this file only names things so the store can be seeded.
# Sub-BA ids and interchange peers were read from the EIA API facets on 2026-09-28.

balancing_authorities:
  - id: ERCO
    name: Electric Reliability Council of Texas
    tz: America/Chicago
    subregions:
      - {id: COAS, name: Coast}
      - {id: EAST, name: East}
      - {id: FWES, name: Far West}
      - {id: NCEN, name: North Central}
      - {id: NRTH, name: North}
      - {id: SCEN, name: South Central}
      - {id: SOUT, name: South}
      - {id: WEST, name: West}
    interchanges_with: [SWPP, CEN]
    hubs:
      - {id: ERCO/HB_HUBAVG, name: ERCOT Hub Average}
  - id: CISO
    name: California Independent System Operator
    tz: America/Los_Angeles
    subregions:
      - {id: PGAE, name: Pacific Gas and Electric}
      - {id: SCE, name: Southern California Edison}
      - {id: SDGE, name: San Diego Gas and Electric}
      - {id: VEA, name: Valley Electric Association}
    interchanges_with: [AZPS, BANC, BPAT, CEN, IID, LDWP, NEVP, PACW, SRP, TIDC, WALC]
    hubs:
      - {id: CISO/TH_NP15_GEN-APND, name: NP15 Trading Hub}
      - {id: CISO/TH_SP15_GEN-APND, name: SP15 Trading Hub}
  - id: PJM
    name: PJM Interconnection
    tz: America/New_York
    subregions:
      - {id: AE, name: Atlantic Electric zone}
      - {id: AEP, name: American Electric Power zone}
      - {id: AP, name: Allegheny Power zone}
      - {id: ATSI, name: American Transmission Systems zone}
      - {id: BC, name: Baltimore Gas & Electric zone}
      - {id: CE, name: Commonwealth Edison zone}
      - {id: DAY, name: Dayton Power & Light zone}
      - {id: DEOK, name: Duke Energy Ohio/Kentucky zone}
      - {id: DOM, name: Dominion Virginia Power zone}
      - {id: DPL, name: Delmarva Power & Light zone}
      - {id: DUQ, name: Duquesne Light zone}
      - {id: EKPC, name: East Kentucky Power Cooperative zone}
      - {id: JC, name: Jersey Central Power & Light zone}
      - {id: ME, name: Metropolitan Edison zone}
      - {id: PE, name: PECO Energy zone}
      - {id: PEP, name: Potomac Electric Power zone}
      - {id: PL, name: Pennsylvania Power & Light zone}
      - {id: PN, name: Pennsylvania Electric zone}
      - {id: PS, name: Public Service Electric & Gas zone}
      - {id: RECO, name: Rockland Electric zone}
    interchanges_with: [CPLE, CPLW, DUK, LGEE, MISO, NYIS, TVA]
    hubs:
      - {id: PJM/WESTERN_HUB, name: PJM Western Hub}
  - id: US48
    name: United States Lower 48
    tz: America/New_York
    interchanges_with: []

# Raw EIA fuel codes seen 2018-2025. Canonical mapping across the 2024 schema change is Phase 2.
fuel_codes:
  - {id: COL, name: coal}
  - {id: NG, name: natural gas}
  - {id: NUC, name: nuclear}
  - {id: OIL, name: petroleum}
  - {id: WAT, name: hydro}
  - {id: WND, name: wind}
  - {id: SUN, name: solar}
  - {id: GEO, name: geothermal}
  - {id: OTH, name: other}
  - {id: UNK, name: unknown}
  - {id: BAT, name: battery storage}
  - {id: PS, name: pumped storage}
  - {id: UES, name: unknown energy storage}
  - {id: OES, name: other energy storage}
  - {id: SNB, name: solar with integrated battery}
  - {id: WNB, name: wind with integrated battery}

# Load-centre points from the spec. US48 uses the population-weighted mean of the others
# plus New York and Atlanta; that aggregate is computed in the semantic layer (Phase 2).
weather_zones:
