# Raw EIA-930 fuel codes -> canonical fuel, with validity windows. EIA revised the fuel
# categories in 2024 Q3 (new storage and hybrid codes); ERCOT reports batteries separately
# from Oct 2024. The mapping lives here once so no query ever branches on the schema date.
codes:
  - {code: COL, canonical: coal,        valid_from: 2018-07-01}
  - {code: NG,  canonical: natural_gas, valid_from: 2018-07-01}
  - {code: NUC, canonical: nuclear,     valid_from: 2018-07-01}
  - {code: OIL, canonical: petroleum,   valid_from: 2018-07-01}
  - {code: WAT, canonical: hydro,       valid_from: 2018-07-01}
  - {code: WND, canonical: wind,        valid_from: 2018-07-01}
  - {code: SUN, canonical: solar,       valid_from: 2018-07-01}
  - {code: GEO, canonical: geothermal,  valid_from: 2018-07-01}
  - {code: OTH, canonical: other,       valid_from: 2018-07-01}
  - {code: BAT, canonical: storage,     valid_from: 2018-07-01}
  - {code: PS,  canonical: storage,     valid_from: 2018-07-01}
  - {code: UNK, canonical: other,       valid_from: 2024-07-01}
  - {code: UES, canonical: storage,     valid_from: 2024-07-01}
  - {code: OES, canonical: storage,     valid_from: 2024-07-01}
  - {code: SNB, canonical: solar,       valid_from: 2024-07-01}
  - {code: WNB, canonical: wind,        valid_from: 2024-07-01}
