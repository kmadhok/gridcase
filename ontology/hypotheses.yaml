# MarketCase drivers: the possible reasons a watched KPI moved (governed; a new driver needs a
# DECISIONS line). A driver is refuted when its falsifier is TRUE. `explains` is the part of
# the change it can account for (divided by the total change = its coverage).
# Placeholders: {kpi} {filters} {window} {baseline_days}.
# Preconditions: "unfiltered:<dim>" (skip when the series is already one segment of <dim>),
# "record_days>=N" (skip until our record is N days old).
templates:
  - id: D0_DATA_PROBLEM
    mechanism: >-
      The movement is an artefact of our data, not of trading: the collector missed trades,
      the public feed stalled, or the window starts before our record does.
    preconditions: []
    tests:
      - {tool: data.coverage, inputs: {window: "{window}"}}
    falsifier: data.coverage.complete == 1
    prior: {a: 1.0, b: 9.0}
    mandatory: true

  - id: D1_ONE_MARKET
    mechanism: >-
      One market accounts for most of the change: news, a live match or a resolution drew
      (or drained) trading in that market.
    preconditions: []
    tests:
      - {tool: by.market, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.market.top_share < 0.5
    prior: {a: 4.0, b: 6.0}
    explains: by.market.top_change

  - id: D2_ONE_CATEGORY
    mechanism: >-
      One category (sports, politics, crypto…) accounts for most of the change: a
      category-wide event rather than a single market.
    preconditions: ["unfiltered:category"]
    tests:
      - {tool: by.category, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.category.top_share < 0.6
    prior: {a: 3.0, b: 7.0}
    explains: by.category.top_change
    consequence_of: [D1_ONE_MARKET]

  - id: D3_NEW_TRADERS
    mechanism: >-
      Traders new to Polymarket drive the change: an acquisition wave (a campaign, press, a
      viral market) or its absence.
    preconditions: ["record_days>=7"]
    tests:
      - {tool: by.trader, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.trader.top_segment != 'new' or by.trader.top_share < 0.5
    prior: {a: 2.0, b: 8.0}
    explains: by.trader.top_change

  - id: D4_WHALES
    mechanism: >-
      A few large trades ($1k and up) drive the change, not ordinary traders.
    preconditions: []
    tests:
      - {tool: by.size, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.size.top_segment != '$1k+' or by.size.top_share < 0.5
    prior: {a: 3.0, b: 7.0}
    explains: by.size.top_change

  - id: D5_LONGSHOTS
    mechanism: >-
      Bets on long shots (outcomes priced under 20%) drive the change: speculative interest in
      unlikely outcomes.
    preconditions: []
    tests:
      - {tool: by.odds, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.odds.top_segment != 'longshot' or by.odds.top_share < 0.5
    prior: {a: 1.5, b: 8.5}
    explains: by.odds.top_change

  - id: D6_BROAD_BASED
    mechanism: >-
      The change is spread across many markets rather than driven by one: a platform-wide
      shift (time of day, a product change, overall interest).
    preconditions: []
    tests:
      - {tool: by.market, inputs: {kpi: "{kpi}", filters: "{filters}", window: "{window}", baseline_days: "{baseline_days}"}}
    falsifier: by.market.top_share >= 0.5
    prior: {a: 3.0, b: 7.0}
    # the explanation of last resort: a specific driver that also holds ranks first
    consequence_of: [D2_ONE_CATEGORY, D3_NEW_TRADERS, D4_WHALES, D5_LONGSHOTS]
