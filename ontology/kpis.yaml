# MarketCase KPIs and dimensions (governed: the only place a KPI's meaning is defined; the
# compiler assembles these fragments and the model never writes SQL). Measures aggregate the
# enriched trades relation, whose dimension columns are d_<name>.
measures:
  volume_usd:
    label: Trading volume
    description: Dollars traded (shares x price), summed over trades.
    unit: usd
    sql: sum(usd)
    additive: true
  trades:
    label: Trades
    description: Number of trades (fills).
    unit: count
    sql: count(*)
    additive: true
  active_traders:
    label: Active traders
    description: Distinct wallets that traded.
    unit: count
    sql: count(DISTINCT wallet)
    additive: false
  new_traders:
    label: New traders
    description: Distinct wallets whose first trade in our record was that day.
    unit: count
    sql: count(DISTINCT wallet) FILTER (WHERE d_trader_type = 'new')
    additive: false
  markets_traded:
    label: Markets traded
    description: Distinct markets with at least one trade.
    unit: count
    sql: count(DISTINCT condition_id)
    additive: false
  new_markets:
    label: New markets
    description: Markets whose first trade in our record happened in that period.
    unit: count
    sql: count(DISTINCT condition_id) FILTER (WHERE ts = first_market_ts)
    additive: false
  whale_volume:
    label: Whale volume
    description: Dollars traded in trades of $1,000 or more.
    unit: usd
    sql: coalesce(sum(usd) FILTER (WHERE d_size_band = '$1k+'), 0)
    additive: true
    internal: true
  sure_thing_volume:
    label: Sure-thing volume
    description: Dollars traded on outcomes priced above 95 cents.
    unit: usd
    sql: coalesce(sum(usd) FILTER (WHERE price > 0.95), 0)
    additive: true
    internal: true
  buy_volume:
    label: Buy volume
    description: Dollars spent buying shares.
    unit: usd
    sql: coalesce(sum(usd) FILTER (WHERE d_side = 'buy'), 0)
    additive: true
    internal: true
  recurring_volume:
    label: Recurring-market volume
    description: Dollars traded in recurring short markets such as 5-minute crypto Up or Down.
    unit: usd
    sql: coalesce(sum(usd) FILTER (WHERE d_market_kind = 'recurring'), 0)
    additive: true
    internal: true
  longshot_trades:
    label: Long-shot trades
    description: Trades on outcomes priced under 10 cents.
    unit: count
    sql: count(*) FILTER (WHERE price < 0.10)
    additive: true
    internal: true

derived:
  avg_trade_usd:
    label: Average trade size
    description: Trading volume divided by trades.
    unit: usd
    expr: volume_usd / trades
    weight: trades
  returning_share:
    label: Returning-trader share
    description: Share of active traders who had traded on an earlier day.
    unit: share
    expr: 1 - new_traders / active_traders
    weight: active_traders
  trades_per_trader:
    label: Trades per trader
    description: Trades divided by active traders.
    unit: ratio
    expr: trades / active_traders
    weight: active_traders
  whale_share:
    label: Whale share of volume
    description: Share of dollars traded that came from trades of $1,000 or more.
    unit: share
    expr: whale_volume / volume_usd
    weight: volume_usd
  sure_thing_share:
    label: Sure-thing share
    description: Share of dollars traded on outcomes priced above 95 cents (near-certain).
    unit: share
    expr: sure_thing_volume / volume_usd
    weight: volume_usd
  buy_share:
    label: Buy share
    description: Share of dollars traded that bought shares rather than sold them.
    unit: share
    expr: buy_volume / volume_usd
    weight: volume_usd
  longshot_share:
    label: Long-shot share
    description: Share of trades on outcomes priced under 10 cents (lottery tickets).
    unit: share
    expr: longshot_trades / trades
    weight: trades
  recurring_share:
    label: Recurring-market share
    description: Share of dollars traded in recurring short markets (5-minute crypto Up or Down).
    unit: share
    expr: recurring_volume / volume_usd
    weight: volume_usd

# a slice's share of a measure: the filters pick the slice, the whole is everything traded
shares:
  volume_share:
    label: Share of volume
    description: The slice's share of all dollars traded (for example Sports' share).
    unit: share
    of: volume_usd

# aggregated per item first (an outcome, a wallet, a market), then across items
nested:
  odds_flips:
    label: Odds flips
    description: >-
      Outcomes whose price crossed 50 cents within the period (from under 45 to over 55 cents,
      at least 5 trades): the favourite changed. Recurring 5-minute markets are left out.
    unit: count
    per: asset
    where: d_market_kind = 'event'
    inner: {lo: min(price), hi: max(price), n: count(*)}
    outer: count(*) FILTER (WHERE lo < 0.45 AND hi > 0.55 AND n >= 5)
    empty_is_zero: true
  whale_count:
    label: Whale wallets
    description: Wallets that traded $10,000 or more in the period.
    unit: count
    per: wallet
    inner: {v: sum(usd)}
    outer: count(*) FILTER (WHERE v >= 10000)
    empty_is_zero: true
  top_market_share:
    label: Top market's share
    description: The biggest market's share of dollars traded; high means one event dominates.
    unit: share
    per: d_market
    inner: {v: sum(usd)}
    outer: max(v) / nullif(sum(v), 0)
    breakdown_as: volume_usd
  # building blocks of the digest's odds swings: an outcome's first and last price in the
  # period (ties broken by price), for outcomes with 20+ trades in event markets
  opening_price:
    label: Opening price
    description: An outcome's first price in the period (event markets, 20 or more trades).
    unit: share
    per: asset
    where: d_market_kind = 'event'
    inner: {p: "arg_min(price, (ts, price))", n: count(*)}
    outer: max(p) FILTER (WHERE n >= 20)
    internal: true
  closing_price:
    label: Closing price
    description: An outcome's last price in the period (event markets, 20 or more trades).
    unit: share
    per: asset
    where: d_market_kind = 'event'
    inner: {p: "arg_max(price, (ts, price))", n: count(*)}
    outer: max(p) FILTER (WHERE n >= 20)
    internal: true

# numeric trade fields a question may put a limit on (>= or <)
numeric:
  trade_usd: usd
  price: price

dimensions:
  category:
    label: Category
    sql: coalesce(m_category, 'Other')
    values: [Sports, Politics, Crypto, Culture, Economy & Finance, Tech & Science, Weather, Other]
  market:
    label: Market
    sql: coalesce(nullif(m_event_title, ''), title)
  size_band:
    label: Trade size
    sql: >-
      CASE WHEN usd < 10 THEN 'under $10' WHEN usd < 100 THEN '$10-100'
      WHEN usd < 1000 THEN '$100-1k' ELSE '$1k+' END
    values: [under $10, $10-100, $100-1k, $1k+]
  trader_type:
    label: Trader
    sql: CASE WHEN CAST(first_ts AS DATE) = CAST(ts AS DATE) THEN 'new' ELSE 'returning' END
    values: [new, returning]
  side:
    label: Side
    sql: lower(side)
    values: [buy, sell]
  odds_band:
    label: Odds
    sql: >-
      CASE WHEN price < 0.2 THEN 'longshot' WHEN price > 0.8 THEN 'favourite'
      ELSE 'toss-up' END
    values: [longshot, toss-up, favourite]
  market_kind:
    label: Market kind
    sql: CASE WHEN title ILIKE '%up or down%' THEN 'recurring' ELSE 'event' END
    values: [event, recurring]
  outcome:
    label: Outcome
    sql: title || ' · ' || outcome
  first_seen_day:
    label: First day in our record
    sql: strftime(CAST(first_ts AS DATE), '%Y-%m-%d')
