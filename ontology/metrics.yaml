# Governed metric layer. Every metric here is the only definition the compiler will execute;
# the LLM selects metric ids, it never writes expressions. Units are MW unless stated.
#
# kind:
#   series        one store series for the entity (BA), optionally with a dimension
#   aggregate     one store series over the entities related to the BA (weather zones, hubs)
#   derived       arithmetic over other metrics, joined on valid_time
#   rolling_ratio numerator / max(numerator over trailing_hours), as_of-safe
# daily_agg: how hourly values roll up when grain=daily.

metrics:
  demand:
    description: Hourly demand as reported on Form EIA-930 (served load; see data caveats).
    unit: MW
    kind: series
    series: eia.D
  demand_forecast:
    description: EIA-930 day-ahead demand forecast for the hour.
    unit: MW
    kind: series
    series: eia.DF
  net_generation:
    description: Net generation within the balancing authority.
    unit: MW
    kind: series
    series: eia.NG
  net_interchange:
    description: Total interchange, positive = net export (EIA convention).
    unit: MW
    kind: series
    series: eia.TI
  forecast_error_mw:
    description: Demand minus day-ahead forecast.
    unit: MW
    kind: derived
    expr: demand - demand_forecast
  forecast_error_pct:
    description: Demand minus forecast as a percentage of forecast.
    unit: pct
    kind: derived
    expr: 100 * (demand - demand_forecast) / demand_forecast
  balance_residual:
    description: Demand minus (net generation minus net interchange); ~0 when the books balance.
    unit: MW
    kind: derived
    expr: demand - (net_generation - net_interchange)
  generation_by_fuel:
    description: Net generation by canonical fuel (raw EIA codes mapped via fuel_categories.yaml).
    unit: MW
    kind: series
    series: eia.fuel
    dims: [fuel]
  demand_by_subregion:
    description: Demand by EIA sub-balancing-authority region.
    unit: MW
    kind: series
    series: eia.subba_demand
    dims: [subregion]
  temp_load_center:
    description: Mean 2 m air temperature across the BA's load-centre weather zones.
    unit: degC
    kind: aggregate
    series: om.temp_2m
    agg: mean
  hdd:
    description: Heating degree-hours/24 (base 18.3 C); daily grain sums to degree-days.
    unit: degday
    kind: derived
    expr: greatest(0, 18.3 - temp_load_center) / 24
    daily_agg: sum
  cdd:
    description: Cooling degree-hours/24 (base 18.3 C); daily grain sums to degree-days.
    unit: degday
    kind: derived
    expr: greatest(0, temp_load_center - 18.3) / 24
    daily_agg: sum
  lmp_rt_hub:
    description: Real-time hourly hub LMP (mean over the BA's hubs).
    unit: USD/MWh
    kind: aggregate
    series: gs.lmp_rt_hub
    agg: mean
    entity_kind: hub
  lmp_da_hub:
    description: Day-ahead hourly hub LMP (mean over the BA's hubs).
    unit: USD/MWh
    kind: aggregate
    series: gs.lmp_da_hub
    agg: mean
    entity_kind: hub
  wind_capacity_factor_proxy:
    description: Wind generation divided by its trailing-30-day maximum.
    unit: ratio
    kind: rolling_ratio
    numerator: generation_by_fuel
    numerator_dims: {fuel: wind}
    trailing_hours: 720
  solar_capacity_factor_proxy:
    description: Solar generation divided by its trailing-30-day maximum.
    unit: ratio
    kind: rolling_ratio
    numerator: generation_by_fuel
    numerator_dims: {fuel: solar}
    trailing_hours: 720
