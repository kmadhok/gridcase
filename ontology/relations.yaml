# Typed relations. Most edges are derived from entities.yaml (has_subregion from
# `subregions`, interchanges_with from `interchanges_with`, has_hub from `hubs`); this file
# declares the relation types and the edges that entities.yaml cannot express.
relation_types:
  has_subregion:     {from: ba, to: subregion}
  interchanges_with: {from: ba, to: ba}
  served_by:         {from: ba, to: weather_zone}
  has_hub:           {from: ba, to: hub}
  reported_as:       {from: fuel, to: fuel_code, versioned_by: fuel_categories.yaml}

# served_by defaults to the zones whose `ba` field names the BA. `all` means every zone.
served_by:
  US48: all
