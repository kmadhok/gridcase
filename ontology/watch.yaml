# What the MarketCase "product team" watches, and how an alarm is decided (governed: changing
# this changes when an investigation opens; log it in DECISIONS). Simple statistics only:
# each complete hour is compared with the same hour of the day on previous days.
params:
  lookback_days: 28        # previous days compared against
  min_history_days: 3      # fewer than this for an hour of the day: "learning"
  recent_hours: 6          # the latest complete hours judged on each run
  settle_minutes: 15       # an hour is judged only this long after it ends
  k_sigma: 3.0             # an hour is unusual beyond this many standard deviations ...
  min_run: 2               # ... for this many hours in a row on the same side,
  single_hour_sigma: 5.0   # or one hour beyond this many
  log_scale: [volume_usd, trades, active_traders, new_traders, avg_trade_usd, markets_traded, odds_flips]  # a 3x jump and a 3x drop count the same
  min_sd: {log: 0.05, linear: 0.01}  # floor on the spread, so a very regular hour cannot alarm on noise
  warmup_days: {new_traders: 7, returning_share: 7}  # "new" means new to our record, which starts 2026-09-29

watched:
  - {kpi: volume_usd}
  - {kpi: active_traders}
  - {kpi: new_traders}
  - {kpi: avg_trade_usd}
  - {kpi: returning_share}
  # how the market behaves (added 2026-09-29, M7)
  - {kpi: markets_traded, group: behaviour}
  - {kpi: whale_share, group: behaviour}
  - {kpi: sure_thing_share, group: behaviour}
  - {kpi: odds_flips, group: behaviour}
  - {kpi: top_market_share, group: behaviour}
  - {kpi: volume_usd, filters: {category: Sports}}
  - {kpi: volume_usd, filters: {category: Politics}}
  - {kpi: volume_usd, filters: {category: Crypto}}
  - {kpi: volume_usd, filters: {category: Culture}}
  - {kpi: volume_usd, filters: {category: Economy & Finance}}
  - {kpi: volume_usd, filters: {category: Tech & Science}}
  - {kpi: volume_usd, filters: {category: Weather}}
  - {kpi: volume_usd, filters: {category: Other}}
