[project]
name = "gridcase"
version = "0.1.0"
description = "Governed investigation engine for plan-vs-actual metrics on US grid data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# gridstatus pulls ~40 packages (plotly, pdfplumber...); keep it opt-in. Pinned per CLAUDE.md.
gridstatus = ["gridstatus==0.36.0"]

[project.scripts]
gridcase = "gridcase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridcase"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["gridstatus", "gridstatus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs / needs the full store; run on the VPS with GRIDCASE_LIVE=1"]
