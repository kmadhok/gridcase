[project]
name = "gridcase"
version = "0.1.0"
description = "MarketCase: a governed analytics agent that explains why Polymarket KPIs move"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "anthropic>=1.9",
    "mcp>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
gridcase = "gridcase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridcase"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "dbt-duckdb>=1.11.0",
]
# M15 RL training and the small-model evals (Tinker). Not installed by default:
# `uv sync --group rl` (pulls PyTorch; a CPU build is enough for tokenizing and rendering).
rl = [
    "tinker==0.33.1",
    "tinker-cookbook==0.5.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs (Polymarket, Anthropic); run with GRIDCASE_LIVE=1"]
